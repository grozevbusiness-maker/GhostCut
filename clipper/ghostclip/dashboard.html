<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostClip</title>
<style>
:root{
  --bg:#f4f3f8; --surface:#ffffff; --sunk:#ebe9f2; --ink:#17151f; --muted:#625e70; --line:#dcd9e5;
  --accent:#6d3df5; --accent-ink:#ffffff; --live:#e5253b; --ok:#13865a; --warn:#b26a00; --hype:#f0a400;
  --shadow:0 1px 2px rgba(20,10,40,.06),0 4px 16px rgba(20,10,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0e14; --surface:#18171f; --sunk:#22202b; --ink:#f1eff7; --muted:#a19cb0; --line:#2e2b3a;
  --accent:#8b63ff; --accent-ink:#ffffff; --live:#ff4d61; --ok:#34c98b; --warn:#ffb340; --hype:#ffc531;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--sunk);font-weight:600;font-size:13px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live i{background:var(--live);animation:pulse 1.4s infinite}
.pill.wait i{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
header .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ghost:hover{background:var(--sunk)}
main{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px 16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
label.f{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:9px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.big{font-size:17px;padding:11px 13px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.stop{background:var(--live)}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.wide{width:100%;font-size:16px;padding:13px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.folder{display:flex;gap:6px;align-items:center;margin-top:14px;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:13px}
.folder code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.folder button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 4px}
.err{color:var(--live);font-weight:600;margin-top:8px;min-height:1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--sunk);border-radius:10px;padding:9px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:14px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden;margin:4px 0 6px}
.meter div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.meter.hot div{background:var(--hype)}
.meter-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
canvas{width:100%;height:110px;display:block;margin-top:10px}
.sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.clip{background:var(--sunk);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.clip video{width:100%;aspect-ratio:9/16;background:#000;display:block;object-fit:contain}
.clip.wide video{aspect-ratio:16/9}
.clip .meta{padding:10px 11px;display:flex;flex-direction:column;gap:6px}
.clip .t{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface);color:var(--muted)}
.badge.k-laugh{color:var(--hype)} .badge.k-clip{color:var(--accent)} .badge.k-hype{color:var(--live)}
.clip .acts{display:flex;gap:6px}
.clip .acts button{flex:1;font-size:12px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1.5px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
details.card>summary{cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;list-style:none}
details.card>summary::before{content:"▸ ";}
details.card[open]>summary::before{content:"▾ ";}
details.card[open]>summary{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid2 .full{grid-column:1/-1}
.set label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.set .hint{margin-top:3px}
.toggle{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:13px;cursor:pointer}
.toggle input{margin-top:3px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
pre.log{margin:0;max-height:260px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.banner{margin:14px 20px 0;padding:11px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-weight:600}
.streams{display:flex;flex-direction:column;gap:10px}
.srow{background:var(--sunk);border-radius:12px;padding:10px 11px}
.srow .top{display:flex;gap:6px;align-items:center}
.srow input{background:var(--surface);font-weight:600}
.srow .go{padding:9px 13px}
.srow .cut{padding:9px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.srow .info{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:7px}
.srow .info b{color:var(--ink);font-weight:600}
.srow .st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meter{height:7px;margin:7px 0 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--live);animation:pulse 1.4s infinite}.dot.wait{background:var(--warn)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>GhostClip</div>
  <span class="pill" id="pill"><i></i><span id="pillText">Ready</span></span>
  <span class="sp"></span>
  <button class="ghost" id="quit" title="Stop everything and close the app">Quit app</button>
</header>
<div class="banner" id="banner" hidden></div>

<main>
  <div class="col">
    <section class="card">
      <h2>Streams <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:500">up to 5 at once</span></h2>
      <div class="streams" id="streams"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" style="flex:1" id="startAll">Start all</button>
        <button class="btn alt" style="flex:1" id="stopAll">Stop all</button>
      </div>
      <div class="hint">Type channel names, then Start. You can start before a stream goes live: GhostClip waits for it.</div>
      <div class="err" id="err"></div>
      <div class="folder"><span>Clips:</span><code id="clipsDir"></code><button data-pick="clips_dir">Change</button><button data-open="clips">Open</button></div>
    </section>

    <details class="card set" id="settings">
      <summary>Settings</summary>
      <div class="grid2" id="setForm"></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="saveSet">Save settings</button><span class="hint" id="saveMsg"></span></div>
    </details>
  </div>

  <div class="col">
    <section class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center">Clips <span id="pending" class="hint" style="margin:0;text-transform:none;letter-spacing:0"></span></h2>
      <div class="clips" id="clips"></div>
    </section>
    <details class="card" open>
      <summary>Activity</summary>
      <pre class="log" id="log"></pre>
    </details>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const FIELDS = [
  ["clips_dir","Clips folder","folder","","Finished clips are saved here."],
  ["recordings_dir","Recordings folder","folder","","The stream recording goes here."],
  ["keep_full_recording","Also save the whole stream when I press Stop","bool","","Off (default): only the clips are kept. The recording is deleted when you press Stop."],
  ["buffer_minutes","Minutes to keep when not saving the whole stream","number"],
  ["layout","Clip format","select",[["stack","Phone: face cam on top, gameplay below (recommended)"],["vertical_crop","Phone: zoomed to the center only"],["vertical_blur","Phone: whole picture on a blurred background"],["original","Original 16:9"]]],
  ["facecam","Where is the face cam?","select",[["auto","Find it automatically"],["top-left","Top left"],["top-right","Top right"],["bottom-left","Bottom left"],["bottom-right","Bottom right"],["none","No face cam"]],"Only change this if auto picks the wrong spot for a streamer."],
  ["captions","Add captions","bool","","Auto-captions of what the streamer says, word by word."],
  ["whisper_model","Caption accuracy","select",[["tiny","Fastest"],["base","Fast"],["small","Good (recommended)"],["medium","Best (slow without a GPU)"]]],
  ["language","Stream language","select",[["","Detect automatically"],["en","English"],["es","Spanish"],["pt","Portuguese"],["fr","French"],["de","German"],["it","Italian"],["ru","Russian"],["bg","Bulgarian"],["pl","Polish"],["tr","Turkish"],["ja","Japanese"],["ko","Korean"]]],
  ["credit","Show twitch.tv/channel on the clip","bool"],
  ["sensitivity","How easily to clip","range","","Left: only huge moments. Right: more clips."],
  ["pre_roll","Seconds before chat reacts","number","","Chat reacts after the moment, so most of the clip comes before."],
  ["post_roll","Seconds after","number"],
  ["min_clip","Shortest clip (s)","number"],
  ["max_clip","Longest clip (s)","number"],
  ["cooldown","Seconds between clips","number"],
  ["sync_offset","Timing nudge (s)","number","","If clips start too early, use a positive number; too late, negative."],
  ["laugh_words","Laughing words and emotes","list","","Comma separated."],
  ["hype_words","Hype words and emotes","list"],
  ["clip_phrases","Clip requests (count extra)","list"],
  ["quality","Recording quality","text","","Tried in order, e.g. 1080p60,720p60,best"],
  ["encoder","Video encoder","select",[["auto","Automatic (NVIDIA GPU if available)"],["x264","CPU only"]]],
  ["twitch_oauth","Twitch token (optional, removes ads if you have Turbo or a sub)","password"],
  ["ffmpeg_path","ffmpeg location (leave empty to find it)","text"],
];
const WIDE = new Set(["facecam","clips_dir","recordings_dir","keep_full_recording","layout","captions","sensitivity","laugh_words","hype_words","clip_phrases","quality","twitch_oauth","ffmpeg_path","credit"]);
let S = null, formFilled = false, clipKey = "", lastState = null, windows = false;

function esc(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
async function post(url,body={}){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()}

function buildForm(){
  const f=$("#setForm"); f.innerHTML="";
  for(const [k,label,type,opts,hint] of FIELDS){
    const d=document.createElement("div"); if(WIDE.has(k)) d.className="full";
    let h="";
    if(type==="bool") h=`<label class="toggle"><input type="checkbox" data-k="${k}"><span>${esc(label)}</span></label>`;
    else {
      h=`<label for="s_${k}">${esc(label)}</label>`;
      if(type==="select") h+=`<select id="s_${k}" data-k="${k}">${opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join("")}</select>`;
      else if(type==="range") h+=`<input id="s_${k}" type="range" min="0.4" max="2.2" step="0.1" data-k="${k}">`;
      else if(type==="list") h+=`<textarea id="s_${k}" rows="2" data-k="${k}"></textarea>`;
      else if(type==="folder") h+=`<div class="row"><input id="s_${k}" type="text" data-k="${k}" spellcheck="false"><button class="btn alt" data-pick="${k}" type="button">Browse</button></div>`;
      else h+=`<input id="s_${k}" type="${type==="number"?"number":type==="password"?"password":"text"}" ${type==="number"?'step="any"':""} data-k="${k}" spellcheck="false">`;
    }
    if(hint) h+=`<div class="hint">${esc(hint)}</div>`;
    d.innerHTML=h; f.appendChild(d);
  }
}
function fillForm(s){
  document.querySelectorAll("#setForm [data-k]").forEach(el=>{
    const v=s[el.dataset.k];
    if(el.type==="checkbox") el.checked=!!v;
    else if(Array.isArray(v)) el.value=v.join(", ");
    else el.value=v??"";
  });
}
function readForm(){
  const o={};
  document.querySelectorAll("#setForm [data-k]").forEach(el=>{
    o[el.dataset.k]= el.type==="checkbox"?el.checked:el.value;
  });
  return o;
}

function fmtTime(sec){sec=sec|0;const h=sec/3600|0,m=(sec%3600)/60|0,s=sec%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}

function clean(v){v=(v||"").trim();const m=v.match(/twitch\.tv\/([A-Za-z0-9_]+)/);if(m)v=m[1];return v.replace(/^[#@]+/,"").trim().toLowerCase()}
let rowsBuilt=false;
function buildRows(n,streams){
  const box=$("#streams");box.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="srow";d.dataset.i=i;
    d.innerHTML=`<div class="top"><span class="dot"></span><input type="text" placeholder="channel ${i+1}" spellcheck="false" autocomplete="off">
      <button class="btn go">Start</button><button class="btn cut" title="Clip the last ~40 seconds now" disabled>✂</button></div>
      <div class="meter"><div></div></div>
      <div class="info"><span class="st">Not started</span><span><b class="rate">0</b> msgs/min · <b class="nclips">0</b> clips</span></div>`;
    d.querySelector("input").value=streams[i]?.channel||"";
    box.appendChild(d);
  }
  rowsBuilt=true;
}
function channelsFromRows(){return [...document.querySelectorAll(".srow input")].map(i=>clean(i.value)).filter(Boolean)}
function renderStreams(st){
  if(!rowsBuilt) buildRows(st.max_streams,st.streams);
  const by={};st.streams.forEach(s=>by[s.channel]=s);
  let live=0,waiting=0;
  document.querySelectorAll(".srow").forEach(row=>{
    const inp=row.querySelector("input"),name=clean(inp.value),s=by[name];
    const state=s?.state||"stopped",running=state==="running",stopping=state==="stopping";
    const rec=running&&/Recording/.test(s.status);
    if(rec) live++; else if(running) waiting++;
    row.querySelector(".dot").className="dot"+(rec?" live":running||stopping?" wait":"");
    const go=row.querySelector(".go");
    go.textContent=stopping?"…":running?"Stop":"Start";go.className="btn go"+(running?" stop":"");go.disabled=stopping||(!name&&!running);
    row.querySelector(".cut").disabled=!running;
    inp.disabled=running||stopping;
    let status=s?(running&&s.in_moment?"🔥 Hype moment! Clipping…":s.status):(name?"Not started":"Empty");
    if(s?.pending && !s.in_moment) status=`Making ${s.pending} clip${s.pending>1?"s":""}… `+status;
    row.querySelector(".st").textContent=status;row.querySelector(".st").title=(s?.status||"")+(s?.chat?" · "+s.chat:"");
    row.querySelector(".rate").textContent=s?.rate??0;row.querySelector(".nclips").textContent=s?.clips??0;
    const pct=s?.threshold?Math.min(100,s.score/s.threshold*100):0;
    row.querySelector(".meter").classList.toggle("hot",pct>=100);row.querySelector(".meter div").style.width=(running?pct:0)+"%";
  });
  const pill=$("#pill");pill.className="pill"+(live?" live":waiting?" wait":"");
  $("#pillText").textContent=live?`Recording ${live} stream${live>1?"s":""}`+(waiting?`, ${waiting} waiting`:""):waiting?`Waiting for ${waiting} stream${waiting>1?"s":""} to go live`:"Ready";
}

function renderClips(clips){
  const key=clips.map(c=>c.file).join("|");
  if(key===clipKey) return; clipKey=key;
  const box=$("#clips");
  if(!clips.length){box.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>No clips yet</b>When chat goes wild (laughing, "LMAO", "KEKW", "CLIP IT"), the clip appears here and in your folder.</div>`;return}
  box.innerHTML=clips.map((c,i)=>{
    const t=c.time?new Date(c.time).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}):c.file;
    const kind={laugh:"😂 funny",hype:"🔥 hype",clip:"🎬 clip it",manual:"✂ manual"}[c.kind]||"clip";
    const wide=c.file && lastState?.settings?.layout==="original" ? " wide":"";
    return `<div class="clip${wide}">
      <video src="${esc(c.url)}#t=0.5" preload="metadata" controls playsinline></video>
      <div class="meta"><div class="t" title="${esc(c.file)}">${esc(c.channel||"")} · ${esc(t)}</div>
      <div class="badges"><span class="badge k-${esc(c.kind)}">${kind}</span>${c.hype?`<span class="badge">${c.hype}x chat</span>`:""}${c.length?`<span class="badge">${Math.round(c.length)}s</span>`:""}</div>
      <div class="acts"><button data-copy="${i}">Copy caption</button><button data-file="${esc(c.file)}">${windows?"Open":"Open"}</button></div></div></div>`}).join("");
  box._clips=clips;
}

function render(st){
  lastState=st; windows=st.windows; S=st.settings;
  if(!formFilled){buildForm();fillForm(S);formFilled=true}
  renderStreams(st);
  $("#clipsDir").textContent=S.clips_dir; $("#clipsDir").title=S.clips_dir;
  const pend=st.streams.reduce((n,s)=>n+(s.pending||0),0);
  $("#pending").textContent=pend?`${pend} clip${pend>1?"s":""} being made…`:"";
  renderClips(st.clips||[]);
  const lg=$("#log"), atBottom=lg.scrollHeight-lg.scrollTop-lg.clientHeight<30;
  lg.textContent=(st.log||[]).join("\n"); if(atBottom) lg.scrollTop=lg.scrollHeight;
  const miss=[]; if(!st.checks.ffmpeg) miss.push("ffmpeg"); if(!st.checks.streamlink) miss.push("streamlink"); if(!st.checks.whisper) miss.push("captions (faster-whisper)"); if(!st.checks.facecam) miss.push("face cam finder (opencv)");
  $("#banner").hidden=!miss.length; if(miss.length) $("#banner").textContent=`Missing: ${miss.join(", ")}. Close GhostClip and run setup_windows.bat (or update.bat) again.`;
}

async function poll(){
  try{render(await (await fetch("/api/state",{cache:"no-store"})).json())}catch(e){$("#pillText").textContent="App closed"}
  setTimeout(poll,1000);
}

async function act(url,body){$("#err").textContent="";const r=await post(url,body);if(!r.ok&&r.error)$("#err").textContent=r.error;return r}
$("#startAll").onclick=()=>act("/api/start-all",{channels:channelsFromRows(),settings:readForm()});
$("#stopAll").onclick=()=>act("/api/stop-all",{});
$("#streams").addEventListener("click",async e=>{
  const row=e.target.closest(".srow"),b=e.target.closest("button"); if(!row||!b) return;
  const name=clean(row.querySelector("input").value), s=lastState?.streams.find(x=>x.channel===name);
  if(b.classList.contains("go")){
    if(s&&s.state==="running") await act("/api/stop",{channel:name});
    else await act("/api/start",{channel:name,channels:channelsFromRows(),settings:readForm()});
  } else if(b.classList.contains("cut")){
    const r=await post("/api/clip-now",{channel:name});toast(r.ok?`Clipping the last 40 seconds of ${name}…`:r.error);
  }
});
$("#streams").addEventListener("change",e=>{if(e.target.matches("input"))post("/api/channels",{channels:channelsFromRows()})});
$("#streams").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input"))e.target.closest(".srow").querySelector(".go").click()});
$("#saveSet").onclick=async()=>{const r=await post("/api/settings",{settings:readForm()});fillForm(r.settings);$("#saveMsg").textContent="Saved";setTimeout(()=>$("#saveMsg").textContent="",2000)};
$("#quit").onclick=async()=>{if(!confirm("Stop all recordings, finish clips and close GhostClip?"))return;await post("/api/quit");toast("Closing… you can close this tab")};
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.pick){
    const k=t.dataset.pick, input=document.querySelector(`#s_${k}`);
    if(!windows){toast("Type or paste the folder path in Settings");$("#settings").open=true;input?.focus();return}
    const r=await post("/api/pick-folder",{current:input?.value||S[k]});
    if(r.ok){input.value=r.path;const s=await post("/api/settings",{settings:{[k]:r.path}});fillForm(s.settings);toast("Folder saved")}
  }
  if(t.dataset.open){const r=await post("/api/open",{target:t.dataset.open});if(!r.ok)toast(r.error)}
  if(t.dataset.file){const r=await post("/api/open",{target:"clip",file:t.dataset.file});if(!r.ok)toast(r.error)}
  if(t.dataset.copy){const c=$("#clips")._clips[+t.dataset.copy];try{await navigator.clipboard.writeText(c.post||c.file);toast("Caption copied")}catch{toast("Couldn't copy")}}
});
poll();
</script>
</body>
</html>
